:root{--page:#e6e6e6;--ink:#111;--rule:#111;--soft:#cfcfcf;--sel:#ececec;--mute:#666}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1f1f1f}}
:root[data-theme="dark"]{--page:#1f1f1f}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);font-family:'DeltaDotum','Malgun Gothic','Apple SD Gothic Neo',monospace;color:var(--ink);text-rendering:optimizeSpeed;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center}
.phone{width:100%;max-width:420px;height:100vh;height:100dvh;max-height:780px;background:#fff;border:1px solid #000;display:flex;flex-direction:column;font-size:18px;line-height:24px;overflow:hidden}
.sb{display:flex;align-items:center;padding:6px 12px 5px;border-bottom:1px solid var(--soft);height:36px;flex:none}
.sb svg{display:block;color:#000;flex:none}
.sb .g{display:flex;align-items:center;gap:8px}
.sb .sp{flex:1}
.sb .g>span{font-size:15px}
.title{display:flex;justify-content:space-between;padding:10px 16px 9px;border-bottom:1px solid var(--rule);flex:none}
.list{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.item{padding:10px 16px 9px;border-bottom:1px solid var(--rule);height:68px;overflow:hidden;cursor:pointer}
.ar{width:14px;height:10px;display:inline-block;vertical-align:-1px;margin-right:6px;color:#000}
.item .d{color:var(--mute);font-size:15px}
.item .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.on{background:var(--sel);outline:1px solid #000;outline-offset:-1px}
.empty{padding:16px;color:var(--mute)}
.view{flex:1;padding:16px;overflow-y:auto}
.view .d{margin-bottom:24px;color:var(--mute);font-size:15px}
.view .t{margin:0;line-height:30px;overflow-wrap:anywhere;white-space:pre-wrap}
.photo-wrap{display:flex;justify-content:center;margin:18px 0 12px}
.photo-img{display:block;max-width:70%;max-height:360px;width:auto;height:auto;object-fit:contain;cursor:zoom-in}
.photo-note{font-size:14px;color:var(--mute)}
.edit{min-height:0;flex-direction:column;gap:10px}
.edit textarea{min-height:96px}
.preview{display:flex;align-items:center;justify-content:center;position:relative;border-top:1px solid #ddd;padding:10px 0 44px;flex:none}
.preview[hidden]{display:none}
.preview img{display:block;max-width:60%;max-height:135px;object-fit:contain}
.preview button{position:absolute;right:0;bottom:0}

.view p{margin:0 0 24px;line-height:30px;overflow-wrap:anywhere}
.edit{flex:1;padding:16px;display:flex}
.edit textarea{flex:1;width:100%;border:0;outline:0;resize:none;padding:0;margin:0;font:inherit;font-size:18px;line-height:24px;color:#000;background:#fff;border-radius:0;caret-color:#000}
.keys{display:flex;justify-content:space-between;padding:14px 16px 18px;border-top:1px solid var(--rule);flex:none}
.btn{font:inherit;font-size:18px;line-height:24px;background:#fff;color:#000;border:1px solid #000;padding:4px 0;width:80px;height:34px;border-radius:0;cursor:pointer}
.btn:active{background:#ddd}
.btn:disabled{color:#999;border-color:#999}
.ov{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;color:#fff;font-size:18px;line-height:24px;text-align:center}
.ov[hidden]{display:none}
.ov img{max-height:78vh;max-width:94vw;object-fit:contain}
</style>
</head>

  <div class="sb"><span class="g"><svg width="15" height="14" viewBox="0 0 22 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 1l6 7 6-7M9 8v11M13 19v-4M16 19v-7M19 19V9"/></svg><svg width="19" height="13" viewBox="0 0 26 18" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="1" width="24" height="16"/><path d="M1 2l12 9 12-9"/></svg></span><span class="sp"></span><span class="g"><span id="clock">PM 11:04</span><svg width="26" height="12" viewBox="0 0 34 16" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="1" width="28" height="14"/><path d="M31 5v6M5 4v8M10 4v8M15 4v8M20 4v8M25 4v8" stroke-width="3"/></svg></span></div>
  <div class="title"><span id="tl"></span><span id="tr"></span></div>
  <div id="body" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
  <div class="keys" id="keys"></div>
</div>
<input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
<div class="ov" id="ov" hidden><img id="oi" alt="첨부한 사진 원본"><button class="btn" id="cl" type="button">닫기</button></div>

<script>
/* ===== 설정: Supabase 프로젝트의 값으로 교체하세요 ===== */
var SUPABASE_URL='https://tbnfbanobnpfxocdmtno.supabase.co';        // 예: https://abcdxyz.supabase.co
var SUPABASE_PUBLISHABLE_KEY='sb_publishable_SwNIRJdpuj0i4hNThMSiMg_SpvDJcgi'; // sb_publishable_... (secret 키 금지)
/* ==================================================== */

var ARROW_OUT='<svg class="ar" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M0 6h14M9 1l5 5-5 5"/></svg>';
var ARROW_IN='<svg class="ar" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 6H2M7 1L2 6l5 5"/></svg>';
var LS='munja_key';
var S={key:null,msgs:[],sel:0,screen:'list',mode:'new',draft:'',photo:null,photoUrl:null,link:'',busy:false,scroll:0,loading:false};

function $(id){return document.getElementById(id)}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lsGet(){try{return localStorage.getItem(LS)}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(LS,v)}catch(e){}}

/* 시간 표시 */
function p2(n){return n<10?'0'+n:''+n}
function h12(d){var h=d.getHours();return {ap:h<12?'AM':'PM',h:(h%12)||12}}
function fmt(iso){var d=new Date(iso),t=h12(d);return d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate())+' '+t.ap+' '+t.h+':'+p2(d.getMinutes())}
function tick(){var d=new Date(),t=h12(d);$('clock').textContent=t.ap+' '+t.h+':'+p2(d.getMinutes())}
/* 옛 문자 방식: 한글 등 2byte, 영문·숫자·기호 1byte */
function bytes(s){var n=0;for(var c of s){n+=c.codePointAt(0)>127?2:1}return n}
var PHOTO_BUCKET='2002kids-images';
var PHOTO_TYPES={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'};
function publicPhoto(path){return SUPABASE_URL+'/storage/v1/object/public/'+PHOTO_BUCKET+'/'+path}
function newPhotoPath(file){
  var a=new Uint8Array(16);crypto.getRandomValues(a);
  var token=Array.from(a,function(v){return v.toString(16).padStart(2,'0')}).join('');
  return 'uploads/'+token+'.'+PHOTO_TYPES[file.type];
}
function clearPhoto(){if(S.photoUrl)URL.revokeObjectURL(S.photoUrl);S.photoUrl=null;S.photo=null;}
function uploadPhoto(file){
  if(!file)return Promise.resolve(null);
  var path=newPhotoPath(file);
  return fetch(SUPABASE_URL+'/storage/v1/object/'+PHOTO_BUCKET+'/'+path,{
    method:'POST',headers:{apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':file.type,'cache-control':'3600','x-upsert':'false'},body:file
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error('사진 업로드 실패 ('+r.status+'): '+t.slice(0,200))});
    return path;
  });
}
function photoMarkup(m){return m.image_path?'<div class="photo-wrap"><img class="photo-img" data-photo="'+esc(m.image_path)+'" src="'+esc(publicPhoto(m.image_path))+'" alt="첨부된 사진" loading="lazy"></div>':''}


/* Supabase RPC */
function configured(){return SUPABASE_URL.indexOf('YOUR_')!==0&&SUPABASE_PUBLISHABLE_KEY.indexOf('YOUR_')!==0}
function rpc(fn,args){
  return fetch(SUPABASE_URL.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:{'Content-Type':'application/json',apikey:SUPABASE_PUBLISHABLE_KEY},
    body:JSON.stringify(args)
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error('HTTP '+r.status+': '+t.slice(0,240))});
    return r.status===204?null:r.json()
  })
}

function load(){
  if(!S.key){S.msgs=[];return Promise.resolve()}
  S.loading=true;render();
  return rpc('list_messages_photo',{p_key:S.key}).then(function(rows){
    S.msgs=rows||[];
    if(S.sel>=S.msgs.length)S.sel=Math.max(0,S.msgs.length-1);
  }).then(function(){S.loading=false},function(err){S.loading=false;throw err})
}

/* 화면 그리기 */
function btn(act,label,extra){return '<button class="btn" type="button" data-act="'+act+'"'+(extra||'')+'>'+label+'</button>'}
function render(){
  var n=S.msgs.length,b=$('body'),tl=$('tl'),tr=$('tr'),k=$('keys');
  if(S.screen==='list'){
    tl.textContent='문자보관함';tr.textContent=(n?S.sel+1:0)+'/'+n;
    var h='';
    if(S.loading&&!n)h='<div class="empty">불러오는 중...</div>';
    else if(!n)h='<div class="empty">문자가 없습니다.</div>';
    else S.msgs.forEach(function(m,i){
      h+='<div class="item'+(i===S.sel?' on':'')+'" data-i="'+i+'"><div class="d">'+(m.mine?ARROW_OUT:ARROW_IN)+fmt(m.created_at)+'</div><div class="p">'+(m.image_path?'[사진] ':'')+esc(m.body)+'</div></div>'
    });
    b.innerHTML='<div class="list" id="list">'+h+'</div>';
    var l=$('list');l.scrollTop=S.scroll;l.onscroll=function(){S.scroll=l.scrollTop};
    k.innerHTML=btn('refresh','새로고침',S.loading?' disabled':'')+btn('new','새 문자');
  }else if(S.screen==='view'){
    var m=S.msgs[S.sel];
    if(!m){S.screen='list';render();return;}
    tl.textContent='문자메시지';tr.textContent=(S.sel+1)+'/'+n;
    b.innerHTML='<div class="view"><div class="d">'+(m.mine?ARROW_OUT:ARROW_IN)+fmt(m.created_at)+'</div><div class="t">'+esc(m.body)+'</div>'+photoMarkup(m)+'</div>';
    k.innerHTML=btn('list','목록')+btn('reply','답장');
  }else if(S.screen==='compose'){
    tl.textContent=S.mode==='reply'?'답장 작성':'새 문자';tr.innerHTML='<span id="bc">'+bytes(S.draft)+' byte</span>';
    b.innerHTML='<div class="edit"><textarea id="ta" aria-label="문자 내용"></textarea><div class="preview" id="preview" hidden><img id="previewImg" alt="선택한 사진 미리보기"><button type="button" class="btn" data-act="remove-photo">제거</button></div></div>';
    var ta=$('ta');ta.value=S.draft;
    ta.oninput=function(){S.draft=ta.value;$('bc').textContent=bytes(S.draft)+' byte'};
    if(S.photoUrl){$('preview').hidden=false;$('previewImg').src=S.photoUrl}
    ta.focus();
    k.innerHTML=btn('cancel','취소')+btn('attach-compose','첨부')+btn('send','보내기',S.busy?' disabled':'');
  }else if(S.screen==='done'){
    tl.textContent='전송 완료';tr.textContent='';
    b.innerHTML='<div class="view"><p style="word-break:keep-all">문자를 보냈습니다.<br>문자를 나눌 상대에게 링크를 전송하세요.</p><p style="overflow-wrap:anywhere">'+esc(S.link)+'</p></div>';
    k.innerHTML=btn('copy','복사')+btn('list','확인');
  }
}
function go(s){S.screen=s;render()}

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
  return new Promise(function(res,rej){
    var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();
    try{document.execCommand('copy')?res():rej()}catch(e){rej()}document.body.removeChild(a)
  })
}

function send(){
  var body=S.draft.replace(/\s+$/,'');
  if((!body.trim()&&!S.photo)||S.busy)return;
  if(!configured()){alert('Supabase 연결 설정이 필요합니다.');return}
  S.busy=true;render();
  uploadPhoto(S.photo).then(function(imagePath){
    if(!S.key){
      return rpc('create_inbox_photo',{p_body:body,p_image_path:imagePath}).then(function(r){
        S.key=r.key_a;lsSet(S.key);
        var base=location.origin+location.pathname;
        history.replaceState(null,'',base+'?m='+S.key);
        S.link=base+'?m='+r.key_b;
        return load().then(function(){S.sel=0;S.draft='';clearPhoto();S.busy=false;go('done')});
      });
    }
    return rpc('send_message_photo',{p_key:S.key,p_body:body,p_image_path:imagePath}).then(function(){
      return load().then(function(){S.sel=0;S.scroll=0;S.draft='';clearPhoto();S.busy=false;go('list')});
    });
  }).catch(function(err){S.busy=false;render();alert('전송하지 못했습니다.\n'+err.message)});
}
function pickPhoto(){
  if(S.busy)return;
  var input=$('photoInput');input.value='';input.click();
}
$('photoInput').addEventListener('change',function(){
  var file=this.files&&this.files[0];if(!file)return;
  if(!PHOTO_TYPES[file.type]){alert('JPG, PNG, WebP, GIF 사진만 첨부할 수 있습니다.');return}
  if(file.size>5*1024*1024){alert('사진은 최대 5MB까지 첨부할 수 있습니다.');return}
  if(S.screen!=='compose'){
    S.mode='reply';S.draft='';go('compose');
  }
  clearPhoto();S.photo=file;S.photoUrl=URL.createObjectURL(file);render();
});
$('cl').onclick=function(){$('ov').hidden=true};
$('ov').addEventListener('click',function(e){if(e.target===$('ov'))$('ov').hidden=true});

/* 이벤트 */
document.addEventListener('click',function(e){
  var photo=e.target.closest&&e.target.closest('[data-photo]');
  if(photo){$('oi').src=photo.src;$('ov').hidden=false;return}
  var it=e.target.closest&&e.target.closest('.item');
  if(it){S.sel=+it.getAttribute('data-i');go('view');return}
  var bt=e.target.closest&&e.target.closest('[data-act]');
  if(!bt)return;
  var a=bt.getAttribute('data-act');
  if(a==='refresh')load().then(render).catch(function(e){render();alert('불러오기 실패: '+e.message)});
  else if(a==='new'){S.mode='new';S.draft='';clearPhoto();go('compose')}
  else if(a==='reply'){S.mode='reply';S.draft='';clearPhoto();go('compose')}
  else if(a==='cancel'){clearPhoto();S.draft='';go('list')}
  else if(a==='list'){go('list')}
  else if(a==='send')send();
  else if(a==='attach'){S.mode='reply';S.draft='';clearPhoto();go('compose');pickPhoto()}
  else if(a==='attach-compose')pickPhoto();
  else if(a==='remove-photo'){clearPhoto();render()}
  else if(a==='copy')copyText(S.link).then(function(){bt.textContent='복사됨'}).catch(function(){alert('복사하지 못했습니다. 링크를 직접 길게 눌러 복사해 주세요.')});
});

/* 시작 */
(function(){
  tick();setInterval(tick,30000);
  var m=new URLSearchParams(location.search).get('m');
  if(m&&/^[0-9a-f]{32}$/.test(m)){S.key=m;lsSet(m)}
  else{S.key=lsGet();if(S.key&&!/^[0-9a-f]{32}$/.test(S.key))S.key=null;
    if(S.key)history.replaceState(null,'',location.pathname+'?m='+S.key)}
  if(!S.key){S.screen='compose';S.mode='new'}
  render();
  if(S.key){if(!configured()){alert('Supabase 설정이 필요합니다. SUPABASE_URL과 SUPABASE_PUBLISHABLE_KEY를 채워 주세요.')}else load().then(render).catch(function(e){render();alert('불러오기 실패: '+e.message)})}
})();
</script>
</body>
</html>
